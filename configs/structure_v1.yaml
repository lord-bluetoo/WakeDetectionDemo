# First ablation: P3 auxiliary learning only; no denoiser or directional convolution.
num_bins: 8
p3_layer_index: 4       # YOLOv8 backbone P3/8 C2f output
hidden_channels: 64
dropout: 0.0
enable_equivariance: true

loss:
  mil_weight: 1.0
  background_weight: 0.25
  orientation_weight: 0.25
  sparse_weight: 0.05
  equivariance_weight: 0.10
  mil_topk_fraction: 0.10
  max_foreground_fraction: 0.25
  orientation_kappa: 4.0
  roi_margin: 0.05
  orientation_presence_floor: 0.10

