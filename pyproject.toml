[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-structure-obb"
version = "0.1.0"
description = "Weakly supervised wake structure head for YOLOv8-OBB"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "ultralytics>=8.3,<9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prepare-swim = "wake_structure.swim:main"

[tool.setuptools.packages.find]
include = ["wake_structure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
